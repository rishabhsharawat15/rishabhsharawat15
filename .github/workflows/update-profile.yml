name: Update profile card

on:
  schedule:
    - cron: "37 18 * * *"   # every day (00:07 IST)
  push:
    branches: [main]
    paths: ["build_profile.py", "me.*"]
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Build SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python build_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg stats_cache.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
